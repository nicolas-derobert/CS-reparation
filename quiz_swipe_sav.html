<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; touch-action: pan-y; }

        /* ----- Cartes de swipe ----- */
        .swipe-card {
            position: absolute;
            top: 0; left: 0; right: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
            cursor: grab;
            user-select: none;
        }
        .swipe-card.dragging { transition: none; cursor: grabbing; }
        .swipe-card.gone-left  { transform: translate(-150%, 50px) rotate(-30deg) !important; opacity: 0 !important; }
        .swipe-card.gone-right { transform: translate(150%,  50px) rotate(30deg)  !important; opacity: 0 !important; }

        /* ----- Indicateurs VRAI / FAUX overlay sur la carte ----- */
        .stamp {
            position: absolute;
            top: 30px;
            padding: 10px 24px;
            border: 4px solid;
            border-radius: 12px;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity 0.15s;
            text-transform: uppercase;
            pointer-events: none;
        }
        .stamp-true  { right: 24px; color: #16a34a; border-color: #16a34a; transform: rotate(15deg); }
        .stamp-false { left: 24px;  color: #e11d48; border-color: #e11d48; transform: rotate(-15deg); }

        /* ----- Timer pulse ----- */
        @keyframes pulseRed {
            0%, 100% { background-color: #fecaca; }
            50% { background-color: #fca5a5; }
        }
        .timer-warning { animation: pulseRed 0.6s infinite; }

        /* ----- Animations fade ----- */
        .fade-in { animation: fadeIn 0.4s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ----- Scroll content ----- */
        .content-scroll::-webkit-scrollbar { width: 6px; }
        .content-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }

        /* ----- Boutons d'action ----- */
        .action-btn {
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .action-btn:active { transform: scale(0.92); }

        /* ----- Optimisations mobile (smartphone) ----- */
        #active-card { touch-action: none; }
        @supports (padding: max(0px)) {
            body {
                padding-left:  max(0.75rem, env(safe-area-inset-left));
                padding-right: max(0.75rem, env(safe-area-inset-right));
                padding-top:   max(0.75rem, env(safe-area-inset-top));
                padding-bottom:max(0.75rem, env(safe-area-inset-bottom));
            }
        }
        @media (max-width: 640px) {
            #card-container { height: 300px !important; }
            #active-card    { min-height: 300px !important; padding: 1rem !important; }
            .stamp { font-size: 22px; padding: 6px 16px; top: 18px; }
            .action-btn { min-height: 56px; }
        }
    </style>
</head>

   BASE LÉGALE — articles du Code des Obligations sur fedlex.admin.ch

    label: alinea ? `art. ${num} al. ${alinea} CO` : `art. ${num} CO`,

});

/* =================================================================
   PARAMÈTRES DE DIFFICULTÉ
   ================================================================= */
const DIFFICULTY = {
    apprenti:  { label: "Apprenti",  time: 30, hex: "#10b981" },
    compagnon: { label: "Compagnon", time: 18, hex: "#f59e0b" },
    maitre:    { label: "Maître",    time: 10, hex: "#f43f5e" }
};

/* =================================================================
   ÉTAT
   ================================================================= */
let state = {
    difficulty: null,
    shuffled: [],
    index: 0,
    score: 0,
    stats: { correct: 0, wrong: 0, timeout: 0 },
    answers: [], // { affirmation, userAnswer, isCorrect, timedOut }
    timer: null,
    timeLeft: 0,
    locked: false
};

/* =================================================================
   DOM
   ================================================================= */
const $ = (id) => document.getElementById(id);

/* =================================================================
   INITIALISATION
   ================================================================= */
let selectedDifficulty = null;

document.querySelectorAll('.difficulty-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.difficulty-btn').forEach(b => {
            b.classList.remove('ring-4', 'ring-offset-2', 'ring-slate-800');
        });
        btn.classList.add('ring-4', 'ring-offset-2', 'ring-slate-800');
        selectedDifficulty = btn.dataset.difficulty;
        $('start-btn').disabled = false;
    });
});

$('start-btn').addEventListener('click', () => {
    if (!selectedDifficulty) return;
    startQuiz(selectedDifficulty);
});

$('restart-btn').addEventListener('click', () => {
    $('end-screen').classList.add('hidden');
    $('start-screen').classList.remove('hidden');
    $('review-zone').classList.add('hidden');
    $('review-zone').innerHTML = '';
    selectedDifficulty = null;
    document.querySelectorAll('.difficulty-btn').forEach(b => {
        b.classList.remove('ring-4', 'ring-offset-2', 'ring-slate-800');
    });
    $('start-btn').disabled = true;
});

$('review-btn').addEventListener('click', () => {
    const z = $('review-zone');
    if (z.classList.contains('hidden')) {
        renderReview();
        z.classList.remove('hidden');
        $('review-btn').innerText = 'Masquer la correction';
    } else {
        z.classList.add('hidden');
        $('review-btn').innerText = 'Voir la correction détaillée';
    }
});

$('abandon-btn').addEventListener('click', () => {
    // Arrêt du timer
    if (state.timer) clearInterval(state.timer);
    state.locked = true;
    // Nettoyage défensif de tous les éléments du quiz
    $('quiz-screen').classList.add('hidden');
    $('explanation-zone').classList.add('hidden');
    $('explanation-zone').innerHTML = '';
    $('next-btn').classList.add('hidden');
    $('action-buttons').classList.remove('hidden');
    $('card-container').innerHTML = '';
    // Retour à l'écran d'accueil
    $('start-screen').classList.remove('hidden');
    $('end-screen').classList.add('hidden');
    $('start-btn').disabled = true;
    selectedDifficulty = null;
    document.querySelectorAll('.difficulty-btn').forEach(b => {
        b.classList.remove('ring-4', 'ring-offset-2', 'ring-slate-800');
    });
});

/* =================================================================
   LANCEMENT DU QUIZ
   ================================================================= */
function startQuiz(diff) {
    state = {
        difficulty: diff,
        shuffled: shuffleArray([...affirmations]),
        index: 0,
        score: 0,
        stats: { correct: 0, wrong: 0, timeout: 0 },
        answers: [],
        timer: null,
        timeLeft: 0,
        locked: false
    };
    $('start-screen').classList.add('hidden');
    $('end-screen').classList.add('hidden');
    $('quiz-screen').classList.remove('hidden');

    // Badge de niveau dans l'en-tête (couleur dynamique via style inline)
    const badge = $('difficulty-badge');
    badge.innerText = DIFFICULTY[diff].label;
    badge.style.backgroundColor = DIFFICULTY[diff].hex;

    renderCard();
}

function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

/* =================================================================
   RENDU D'UNE CARTE
   ================================================================= */
function renderCard() {
    state.locked = false;
    const aff = state.shuffled[state.index];

    // En-tête
    $('progress-text').innerText = `${state.index + 1} / ${state.shuffled.length}`;
    $('score-text').innerText = state.score;

    // Cartes
    const c = $('card-container');
    c.innerHTML = `
        <div id="active-card" class="swipe-card bg-white border-2 border-slate-200 rounded-3xl p-6 sm:p-8 shadow-xl flex flex-col" style="min-height: 380px;">
            <div class="flex items-center justify-between mb-4">
                <span class="px-3 py-1 bg-slate-900 text-white text-[10px] font-bold rounded-full uppercase tracking-wider">Affirmation</span>
                <span class="text-xs font-bold text-slate-400">${state.index + 1}/${state.shuffled.length}</span>
            </div>
            <div class="flex-1 flex items-center justify-center text-center py-4">
                <p class="text-base sm:text-xl font-semibold text-slate-800 leading-relaxed">${aff.text}</p>
            </div>
            <div class="text-center pt-4 border-t border-slate-100">
                <p class="text-xs text-slate-400">
                    <span class="hidden sm:inline">Glissez la carte ou cliquez sur un bouton</span>
                    <span class="sm:hidden">Swipez ← FAUX ou VRAI →</span>
                </p>
            </div>
            <div class="stamp stamp-true">VRAI</div>
            <div class="stamp stamp-false">FAUX</div>
        </div>
    `;

    // Cacher l'explication et le bouton next
    $('explanation-zone').classList.add('hidden');
    $('explanation-zone').innerHTML = '';
    $('next-btn').classList.add('hidden');
    $('action-buttons').classList.remove('hidden');

    // Attacher les listeners
    attachSwipeListeners();
    $('true-btn').onclick = () => answer(true);
    $('false-btn').onclick = () => answer(false);

    // Démarrer le timer
    startTimer();
}

/* =================================================================
   TIMER
   ================================================================= */
function startTimer() {
    state.timeLeft = DIFFICULTY[state.difficulty].time;
    updateTimerDisplay();
    state.timer = setInterval(() => {
        state.timeLeft -= 0.1;
        if (state.timeLeft <= 0) {
            state.timeLeft = 0;
            clearInterval(state.timer);
            updateTimerDisplay();
            handleTimeout();
        } else {
            updateTimerDisplay();
        }
    }, 100);
}

function updTimerWarning(percent) {
    const bar = $('timer-bar');
    if (percent < 25) bar.classList.add('timer-warning');
    else bar.classList.remove('timer-warning');
}

function updateTimerDisplay() {
    const total = DIFFICULTY[state.difficulty].time;
    const pct = Math.max(0, (state.timeLeft / total) * 100);
    $('timer-bar').style.width = pct + '%';
    $('timer-text').innerText = Math.ceil(state.timeLeft) + 's';
    updTimerWarning(pct);
}

function handleTimeout() {
    if (state.locked) return;
    state.locked = true;
    const aff = state.shuffled[state.index];
    state.stats.timeout++;
    state.answers.push({ affirmation: aff, userAnswer: null, isCorrect: false, timedOut: true });
    showExplanation(null, true);
}

/* =================================================================
   GESTION DE LA RÉPONSE
   ================================================================= */
function answer(userValue) {
    if (state.locked) return;
    state.locked = true;
    clearInterval(state.timer);

    const aff = state.shuffled[state.index];
    const isCorrect = (userValue === aff.answer);

    if (isCorrect) {
        state.score++;
        state.stats.correct++;
    } else {
        state.stats.wrong++;
    }
    state.answers.push({ affirmation: aff, userAnswer: userValue, isCorrect, timedOut: false });

    // Animation de sortie de la carte
    const card = $('active-card');
    if (card) {
        card.classList.add(userValue ? 'gone-right' : 'gone-left');
    }

    setTimeout(() => showExplanation(userValue, false), 400);
}

function goNext() {

                ${legalLink}

}

/* =================================================================
   SWIPE — gestion tactile et souris
   ================================================================= */
function attachSwipeListeners() {
    const card = $('active-card');
    if (!card) return;
    let startX = 0, currentX = 0, isDragging = false;

    const onStart = (clientX) => {
        if (state.locked) return;
        isDragging = true;
        startX = clientX;
        card.classList.add('dragging');
    };

    const onMove = (clientX) => {
        if (!isDragging) return;
        currentX = clientX - startX;
        const rotation = currentX / 20;
        card.style.transform = `translate(${currentX}px, 0) rotate(${rotation}deg)`;

        // Indicateurs visuels
        const trueStamp = card.querySelector('.stamp-true');
        const falseStamp = card.querySelector('.stamp-false');
        if (currentX > 50) {
            trueStamp.style.opacity = Math.min(1, currentX / 150);
            falseStamp.style.opacity = 0;
        } else if (currentX < -50) {
            falseStamp.style.opacity = Math.min(1, -currentX / 150);
            trueStamp.style.opacity = 0;
        } else {
            trueStamp.style.opacity = 0;
            falseStamp.style.opacity = 0;
        }
    };

    const onEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        card.classList.remove('dragging');
        const threshold = 120;
        if (currentX > threshold) {
            answer(true);
        } else if (currentX < -threshold) {
            answer(false);
        } else {
            // snap back
            card.style.transform = '';
            card.querySelector('.stamp-true').style.opacity = 0;
            card.querySelector('.stamp-false').style.opacity = 0;
        }
        currentX = 0;
    };

    // Touch
    card.addEventListener('touchstart', (e) => onStart(e.touches[0].clientX), { passive: true });
    card.addEventListener('touchmove',  (e) => onMove(e.touches[0].clientX),  { passive: true });
    card.addEventListener('touchend',   onEnd);

    // Mouse
    card.addEventListener('mousedown', (e) => onStart(e.clientX));
    document.addEventListener('mousemove', (e) => { if (isDragging) onMove(e.clientX); });
    document.addEventListener('mouseup', onEnd);
}
</script>
</body>
</html>
