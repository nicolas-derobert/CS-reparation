<!DOCTYPE html>

        /* Animation fluide pour l'apparition des explications */

            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Personnalisation de la scrollbar pour les onglets et le contenu */
        .no-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .no-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .no-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        .content-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .content-scroll::-webkit-scrollbar-track {
            background: #f9fafb;
        }
        .content-scroll::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;

            </div>

        </div>

                    isActive 
                    ? 'border-blue-500 bg-slate-800 text-white shadow-inner' 
                    : 'border-transparent text-slate-400 hover:text-white hover:bg-slate-800/50 hover:border-slate-600'
                }`;
                
                // Texte de l'onglet
                const textSpan = document.createElement('span');
                textSpan.innerText = theme.title;
                btn.appendChild(textSpan);
                
                // Icône flèche si actif (visible surtout sur desktop)
                if (isActive) {
                    const iconSpan = document.createElement('span');
                    iconSpan.innerHTML = `<svg class="w-4 h-4 text-blue-500 hidden md:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>`;
                    btn.appendChild(iconSpan);
                }

                btn.onclick = () => loadTheme(index);
                domElements.tabsContainer.appendChild(btn);
            });
        }

        // Chargement d'un thème spécifique
        function loadTheme(index) {
            currentThemeIndex = index;
            currentQuestionIndex = 0;
            score = 0;
            
            // Scroll le contenu principal en haut
            domElements.mainContent.scrollTop = 0;
            
            // Mettre à jour l'UI des onglets
            renderTabs();
            
            // Centrer l'onglet actif sur mobile
            const activeTab = domElements.tabsContainer.children[index];
            if (activeTab) {
                activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
            
            // Afficher le quiz, cacher le score final
            domElements.scoreScreen.classList.add('hidden');
            domElements.scoreScreen.classList.remove('flex');
            domElements.quizScreen.classList.remove('hidden');
            
            // Titre du thème courant
            domElements.currentThemeTitle.innerText = quizThemes[index].title;
            
            renderQuestion();
        }

        // Affichage de la question actuelle
        function renderQuestion() {
            isAnswered = false;
            const theme = quizThemes[currentThemeIndex];
            const currentQuizData = theme.questions[currentQuestionIndex];

            // Mise à jour de la barre de progression
            const progressPercentage = ((currentQuestionIndex) / theme.questions.length) * 100;
            domElements.progressText.innerText = `Question ${currentQuestionIndex + 1} sur ${theme.questions.length}`;
            domElements.progressPercentage.innerText = `${Math.round(progressPercentage)}%`;
            
            // Petit délai pour l'animation de la barre de progression
            setTimeout(() => {
                const newPercentage = ((currentQuestionIndex + 1) / theme.questions.length) * 100;
                domElements.progressBar.style.width = `${newPercentage}%`;
                domElements.progressPercentage.innerText = `${Math.round(newPercentage)}%`;
            }, 50);

            // Injection de la question
            domElements.questionText.innerText = currentQuizData.question;

            // Injection des options
            domElements.optionsContainer.innerHTML = ''; 
            currentQuizData.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'group w-full text-left p-4 sm:p-5 rounded-xl border-2 transition-all duration-200 font-medium flex items-center bg-white border-slate-200 text-slate-700 hover:bg-blue-50 hover:border-blue-400 focus:outline-none shadow-sm';
                btn.onclick = () => handleAnswerOptionClick(index);
                
                // Lettrage des options (A, B, C, D)
                const letterSpan = document.createElement('span');
                letterSpan.className = 'w-8 h-8 sm:w-10 sm:h-10 rounded-full border-2 border-slate-200 flex items-center justify-center mr-4 flex-shrink-0 text-sm font-bold text-slate-500 bg-slate-50 transition-colors group-hover:border-blue-300 group-hover:text-blue-600 group-hover:bg-blue-100';
                letterSpan.innerText = String.fromCharCode(65 + index);
                
                // Texte de l'option
                const textNode = document.createElement('span');
                textNode.className = 'flex-1 text-sm sm:text-base leading-snug';
                textNode.innerText = option;
                
                btn.appendChild(letterSpan);
                btn.appendChild(textNode);
                
                domElements.optionsContainer.appendChild(btn);
            });

            // Cacher la section explication
            domElements.explanationContainer.classList.add('hidden');
        }

        // Gestion du clic sur une réponse
        function handleAnswerOptionClick(selectedIndex) {
            if (isAnswered) return;
            isAnswered = true;
            
            const theme = quizThemes[currentThemeIndex];
            const currentQuizData = theme.questions[currentQuestionIndex];
            const isCorrect = selectedIndex === currentQuizData.correctAnswer;
            
            if (isCorrect) {
                score++;
            }

            // Mettre à jour l'affichage de tous les boutons
            const buttons = domElements.optionsContainer.children;
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true; // Désactiver le clic
                buttons[i].classList.remove('hover:bg-blue-50', 'hover:border-blue-400', 'cursor-pointer', 'shadow-sm');
                buttons[i].classList.add('cursor-default');
                
                const letterBadge = buttons[i].querySelector('span');

                if (i === currentQuizData.correctAnswer) {
                    // Bonne réponse
                    buttons[i].classList.replace('bg-white', 'bg-green-50');
                    buttons[i].classList.replace('border-slate-200', 'border-green-500');
                    buttons[i].classList.replace('text-slate-700', 'text-green-900');
                    buttons[i].classList.add('shadow-md');
                    
                    letterBadge.classList.replace('bg-slate-50', 'bg-green-500');
                    letterBadge.classList.replace('text-slate-500', 'text-white');
                    letterBadge.classList.replace('border-slate-200', 'border-green-500');
                    letterBadge.classList.remove('group-hover:border-blue-300', 'group-hover:text-blue-600', 'group-hover:bg-blue-100');
                } else if (i === selectedIndex) {
                    // Mauvaise réponse sélectionnée
                    buttons[i].classList.replace('bg-white', 'bg-rose-50');
                    buttons[i].classList.replace('border-slate-200', 'border-rose-400');
                    buttons[i].classList.replace('text-slate-700', 'text-rose-900');
                    
                    letterBadge.classList.replace('bg-slate-50', 'bg-rose-500');
                    letterBadge.classList.replace('text-slate-500', 'text-white');
                    letterBadge.classList.replace('border-slate-200', 'border-rose-500');
                    letterBadge.classList.remove('group-hover:border-blue-300', 'group-hover:text-blue-600', 'group-hover:bg-blue-100');
                } else {
                    // Autres réponses
                    buttons[i].classList.replace('bg-white', 'bg-slate-50');
                    buttons[i].classList.replace('text-slate-700', 'text-slate-400');
                    buttons[i].classList.add('opacity-60');
                    letterBadge.classList.remove('group-hover:border-blue-300', 'group-hover:text-blue-600', 'group-hover:bg-blue-100');
                }
            }

            // Afficher l'explication et la citation
            domElements.explanationContainer.classList.remove('hidden');
            domElements.explanationText.innerText = currentQuizData.explanation;
            
            if (currentQuizData.quote) {
                domElements.quoteBox.classList.remove('hidden');
                domElements.explanationQuote.innerText = `« ${currentQuizData.quote} »`;
            } else {
                domElements.quoteBox.classList.add('hidden');
            }
            
            // Icones pour les titres d'explication
            const successIcon = `<svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            const errorIcon = `<svg class="w-6 h-6 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;

            if (isCorrect) {
                domElements.explanationBox.className = 'p-4 sm:p-5 rounded-xl mb-4 bg-green-50 text-green-900 border border-green-200 shadow-sm';
                domElements.explanationTitle.innerHTML = `${successIcon} Bonne réponse !`;
            } else {
                domElements.explanationBox.className = 'p-4 sm:p-5 rounded-xl mb-4 bg-rose-50 text-rose-900 border border-rose-200 shadow-sm';
                domElements.explanationTitle.innerHTML = `${errorIcon} Incorrect`;
            }

            // Modifier le bouton "Suivant"
            const btnSpan = domElements.nextBtn.querySelector('span');
            if (currentQuestionIndex === theme.questions.length - 1) {
                btnSpan.innerText = 'Voir le score du thème';
            } else {
                btnSpan.innerText = 'Question suivante';
            }
            
            // Auto scroll légèrement vers le bas pour voir l'explication
            setTimeout(() => {
                domElements.explanationContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        // Passage à la question suivante
        function handleNextQuestion() {
            const theme = quizThemes[currentThemeIndex];
            if (currentQuestionIndex < theme.questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
                domElements.mainContent.scrollTop = 0;
            } else {
                showFinalScore();
            }
        }

        // Affichage de l'écran des scores pour un thème
        function showFinalScore() {
            domElements.quizScreen.classList.add('hidden');
            domElements.scoreScreen.classList.remove('hidden');
            domElements.scoreScreen.classList.add('flex');
            
            domElements.mainContent.scrollTop = 0;

            const theme = quizThemes[currentThemeIndex];
            domElements.finalScoreText.innerText = `${score}/${theme.questions.length}`;

            // Changement de couleur du cercle de score selon le résultat
            const scoreCircle = domElements.finalScoreText.parentElement;
            scoreCircle.className = "w-24 h-24 sm:w-32 sm:h-32 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner border-4";
            
            const ratio = score / theme.questions.length;
            if (ratio === 1) {
                scoreCircle.classList.add("bg-green-50", "border-green-500");
                domElements.scoreMessage.innerHTML = "<strong>Excellente maîtrise !</strong><br>Vous avez parfaitement assimilé toutes les notions de ce chapitre.";
            } else if (ratio >= 0.6) {
                scoreCircle.classList.add("bg-blue-50", "border-blue-500");
                domElements.scoreMessage.innerHTML = "<strong>Très bon score !</strong><br>Vous avez de solides connaissances sur ce thème du Service Après-Vente.";
            } else {
                scoreCircle.classList.add("bg-orange-50", "border-orange-400");
                domElements.scoreMessage.innerHTML = "<strong>Un petit effort !</strong><br>Une relecture de ce chapitre de la théorie vous sera bénéfique pour consolider vos acquis.";
            }

            // Afficher ou cacher le bouton "Thème suivant"
            if (currentThemeIndex < quizThemes.length - 1) {
                domElements.nextThemeBtn.classList.remove('hidden');
                domElements.scoreTitle.innerText = "Thème validé !";
            } else {
                domElements.nextThemeBtn.classList.add('hidden');
                domElements.scoreTitle.innerText = "🎉 Formation terminée !";
                domElements.scoreMessage.innerHTML += "<br><br>Vous avez parcouru avec succès l'ensemble des 9 modules de ce cursus théorique.";
            }
        }

        // Recommencer le thème courant
        function restartTheme() {
            loadTheme(currentThemeIndex);
        }

        // Passer au thème suivant
        function goToNextTheme() {
            if (currentThemeIndex < quizThemes.length - 1) {
                loadTheme(currentThemeIndex + 1);
            }
        }

        // Démarrage de l'application
        init();
    </script>
</body>
</html>
