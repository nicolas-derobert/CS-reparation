        body {
            margin: 0; padding: 0;

            color: var(--c-ink);

        /* Fond avec gradients colorés très subtils */
        .vibrant-bg {
            background: var(--c-bg);
            background-image:

                radial-gradient(circle at 60% 50%, rgba(16, 185, 129, 0.04) 0%, transparent 50%);
        }

        /* Header sombre uni */
        .gradient-header {
            background: #0F0F14;
            position: relative;
        }
        .gradient-header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(79, 70, 229, 0.08) 50%, transparent 100%);
            pointer-events: none;
        }

        /* Animations */
        @keyframes fade-up {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .anim-fade { animation: fade-up 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .stagger > * { animation: fade-up 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .stagger > *:nth-child(1) { animation-delay: 0.05s; }
        .stagger > *:nth-child(2) { animation-delay: 0.12s; }
        .stagger > *:nth-child(3) { animation-delay: 0.19s; }
        .stagger > *:nth-child(4) { animation-delay: 0.26s; }
        .stagger > *:nth-child(5) { animation-delay: 0.33s; }

        /* Carte de poste — design coloré et dynamique */
        .node-card {
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
            background: white;
            position: relative;
        }
        .node-card:hover {
            transform: translateY(-3px) scale(1.02);
        }
        .node-card.selected {
            transform: translateY(-3px) scale(1.05);
            z-index: 10;
        }

        /* Effet "glow" coloré au hover */
        .node-card.dept-Direction:hover, .node-card.dept-Direction.selected {
            box-shadow: 0 12px 24px -6px rgba(79, 70, 229, 0.35), 0 0 0 2px var(--c-direction);
        }
        .node-card.dept-Admin:hover, .node-card.dept-Admin.selected {
            box-shadow: 0 12px 24px -6px rgba(100, 116, 139, 0.30), 0 0 0 2px var(--c-admin);

        .node-card.dept-Client:hover, .node-card.dept-Client.selected {
            box-shadow: 0 12px 24px -6px rgba(245, 158, 11, 0.35), 0 0 0 2px var(--c-client);
        }
        .node-card.dept-Logistique:hover, .node-card.dept-Logistique.selected {
            box-shadow: 0 12px 24px -6px rgba(8, 145, 178, 0.35), 0 0 0 2px var(--c-logistique);

        .node-card.dept-Formation:hover, .node-card.dept-Formation.selected {
            box-shadow: 0 12px 24px -6px rgba(219, 39, 119, 0.35), 0 0 0 2px var(--c-formation);
        }
        .node-card.dept-Technique:hover, .node-card.dept-Technique.selected {
            box-shadow: 0 12px 24px -6px rgba(16, 185, 129, 0.35), 0 0 0 2px var(--c-technique);
        }
        .node-card.dept-Qualité:hover, .node-card.dept-Qualité.selected {
            box-shadow: 0 12px 24px -6px rgba(239, 68, 68, 0.35), 0 0 0 2px var(--c-qualite);

        .node-card.dept-Filiale:hover, .node-card.dept-Filiale.selected {
            box-shadow: 0 12px 24px -6px rgba(161, 161, 170, 0.30), 0 0 0 2px var(--c-filiale);
        }
        .node-card.dept-Tech:hover, .node-card.dept-Tech.selected {
            box-shadow: 0 12px 24px -6px rgba(124, 58, 237, 0.35), 0 0 0 2px var(--c-tech);
        }

        /* Scrollbar discrète */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(15, 15, 20, 0.18);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(15, 15, 20, 0.35);
        }

        /* Filet uniforme */
        .hairline { border-color: rgba(15, 15, 20, 0.08); }

        /* Focus */
        button:focus-visible, select:focus-visible, input:focus-visible {
            outline: 2px solid #4F46E5;
            outline-offset: 2px;
        }

        /* Button hover */
        .btn-primary {
            background: #0F0F14;
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
        }

        /* Connector lignes */
        .connector-v { background: rgba(15, 15, 20, 0.18); }
        .connector-h { background: rgba(15, 15, 20, 0.18); }

        /* Glass effect */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Tab actif */
        .tab-active {
            background: #0F0F14;
            color: white;
        }

        /* Tabular nums */
        .tabular { font-variant-numeric: tabular-nums; }

        /* Hover scale */
        .hover-lift { transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); }

        /* Print */
        @media print {
            body { background: white; }
            .no-print { display: none !important; }
            .gradient-header { background: #0F0F14 !important; }
        }

        /* ============================================================
           MÉTRIQUES
           ============================================================ */
        const computeMetrics = (members) => {
            const total = members.length;
            const productive = members.filter(m => m.productive).length;
            const support = total - productive;
            const ratio = total > 0 ? Math.round((productive / total) * 100) : 0;

            const getDepth = (id, depth = 0) => {
                const m = members.find(x => x.id === id);
                if (!m || m.managerId === null) return depth;
                return getDepth(m.managerId, depth + 1);
            };
            const maxDepth = Math.max(...members.map(m => getDepth(m.id))) + 1;

            const depts = {};
            members.forEach(m => { depts[m.department] = (depts[m.department] || 0) + 1; });

            return { total, productive, support, ratio, maxDepth, depts };
        };

           ============================================================ */

                                                onClick={() => setView(v.id)}
                                                className={`px-3 py-2 text-[13px] rounded-md flex items-center gap-1.5 transition-all font-semibold ${
                                                    view === v.id ? 'tab-active' : 'text-zinc-500 hover:text-zinc-900'
                                                }`}
                                            >
                                                <VIcon size={13} strokeWidth={1.75} /> {v.label}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* ============ CONTENU ============ */}
                    <div className="flex-1 flex overflow-hidden">
                        <main className="flex-1 overflow-y-auto">
                            <div className="max-w-[1400px] mx-auto px-7 py-10">
                                {/* Présentation du modèle */}
                                {view !== 'compare' && (
                                    <div className="mb-10 anim-fade">
                                        <div className="flex items-start gap-6 mb-7">
                                            <div className="w-16 h-16 rounded-2xl flex items-center justify-center shrink-0 shadow-lg" style={{ background: `linear-gradient(135deg, ${model.accent}, ${model.accent}DD)` }}>
                                                <Icon size={28} className="text-white" strokeWidth={1.5} />
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <div className="inline-flex items-center gap-2 text-[10px] uppercase tracking-caps font-bold mb-2 px-3 py-1 rounded-full"
                                                     style={{ background: `${model.accent}22`, color: model.accent }}>
                                                    {model.subtitle}
                                                </div>
                                                <h2 className="font-display text-[2.5rem] leading-[1.1] tracking-tight mb-3 font-bold text-zinc-900">{model.label}</h2>
                                                <p className="text-[14px] text-zinc-700 leading-relaxed max-w-3xl">{model.description}</p>
                                                <div className="mt-4 inline-flex items-start gap-2 text-[12px] text-zinc-700 italic px-4 py-2.5 rounded-lg border-l-4"
                                                     style={{ background: `${model.accent}10`, borderColor: model.accent }}>
                                                    <MapPin size={12} className="mt-0.5 shrink-0" style={{ color: model.accent }} />
                                                    {model.context}
                                                </div>
                                            </div>
                                        </div>

                                        {/* KPIs colorés */}
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 stagger">
                                            <KpiCard
                                                icon={Users}
                                                label="Effectif"
                                                value={metrics.total}
                                                sub="collaborateurs"
                                                gradient="linear-gradient(135deg, #4F46E5, #7C3AED)"
                                            />
                                            <KpiCard
                                                icon={Wrench}
                                                label="Productifs"
                                                value={metrics.productive}
                                                sub={`${metrics.ratio}% du total`}
                                                gradient="linear-gradient(135deg, #10B981, #059669)"
                                            />
                                            <KpiCard
                                                icon={ShieldCheck}
                                                label="Support"
                                                value={metrics.support}
                                                sub={`${100 - metrics.ratio}% du total`}
                                                gradient="linear-gradient(135deg, #F59E0B, #DB2777)"
                                            />
                                            <KpiCard
                                                icon={Layers}
                                                label="Niveaux"
                                                value={metrics.maxDepth}
                                                sub="hiérarchiques"
                                                gradient="linear-gradient(135deg, #0891B2, #4F46E5)"
                                            />
                                        </div>
                                    </div>
                                )}

                                {/* Vue : Organigramme */}
                                {view === 'org' && (
                                    <div className="bg-white border hairline rounded-2xl p-7 anim-fade shadow-sm">
                                        <div className="flex items-center justify-between mb-6 flex-wrap gap-3">
                                            <div>
                                                <div className="inline-flex items-center gap-2 text-[11px] uppercase tracking-caps font-bold mb-1 px-3 py-1 rounded-full bg-indigo-50 text-indigo-700">
                                                    <Network size={11} /> Hiérarchie
                                                </div>
                                                <h3 className="font-display text-xl text-zinc-900 tracking-tight font-bold mt-1">Structure de l'atelier</h3>
                                            </div>
                                            <label className="flex items-center gap-3 cursor-pointer">
                                                <span className="text-[10px] uppercase tracking-caps text-zinc-500 font-bold">Identités</span>
                                                <button
                                                    onClick={() => setShowIdentity(!showIdentity)}
                                                    className={`relative w-11 h-6 rounded-full transition-all ${showIdentity ? 'bg-indigo-600' : 'bg-zinc-300'}`}
                                                >
                                                    <div className={`absolute top-0.5 w-5 h-5 bg-white rounded-full transition-all shadow-md ${showIdentity ? 'left-5' : 'left-0.5'}`}></div>
                                                </button>
                                                {showIdentity ? <Eye size={14} className="text-indigo-500" /> : <EyeOff size={14} className="text-zinc-400" />}
                                            </label>
                                        </div>

                                        {/* Légende colorée */}
                                        <div className="flex flex-wrap items-center gap-x-4 gap-y-2 text-[10px] uppercase tracking-caps font-bold mb-6 pb-4 border-b hairline">
                                            <div className="flex items-center gap-1.5 px-2 py-1 rounded-full bg-emerald-50 text-emerald-700">
                                                <Star size={9} className="fill-emerald-500 text-emerald-500" />Productif
                                            </div>
                                            <div className="flex items-center gap-1.5 px-2 py-1 rounded-full bg-zinc-50 text-zinc-600">
                                                <div className="w-1.5 h-1.5 rounded-full bg-zinc-400"></div>Support
                                            </div>
                                            <div className="w-px h-4 bg-zinc-200 mx-1"></div>
                                            {Object.entries(DEPT).filter(([d]) => metrics.depts[d]).map(([d, c]) => (
                                                <div key={d} className={`flex items-center gap-1.5 px-2 py-1 rounded-full ${c.bgLight} ${c.text}`}>
                                                    <div className="w-1.5 h-1.5 rounded-full" style={{ background: c.hex }}></div>
                                                    {d}
                                                </div>
                                            ))}
                                        </div>

                                        <div className="overflow-x-auto pb-4">
                                            <div className="min-w-max flex justify-center py-6">
                                                {root && (
                                                    <OrgTree
                                                        root={root}
                                                        allMembers={model.members}
                                                        showIdentity={showIdentity}
                                                        onSelect={setSelectedMember}
                                                        selectedId={selectedMember?.id}
                                                    />
                                                )}
                                            </div>
                                        </div>

                                        {!selectedMember && (
                                            <div className="text-center text-[11px] text-zinc-500 italic mt-6 flex items-center justify-center gap-2 pt-4 border-t hairline font-medium">
                                                <Sparkles size={11} className="text-pink-500" />
                                                Cliquez sur un poste pour afficher la fiche de rôle détaillée
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Vue : Tableau */}
                                {view === 'table' && (
                                    <div className="anim-fade">
                                        <TableView members={model.members} onSelect={setSelectedMember} selectedId={selectedMember?.id} />
                                    </div>
                                )}

                                {/* Vue : Comparaison */}
                                {view === 'compare' && <CompareView />}
                            </div>
                        </main>

                        {/* Panel détail */}
                        {selectedMember && view !== 'compare' && (
                            <RoleDetailPanel
                                member={selectedMember}
                                allMembers={model.members}
                                onClose={() => setSelectedMember(null)}
                            />
                        )}
                    </div>

                    {/* ============ FOOTER ============ */}
                    <footer className="text-[10px] py-3 text-center uppercase tracking-caps no-print font-bold text-white border-t border-white/10"
                            style={{ background: '#0F0F14' }}>
                        <span className="text-amber-300">Nicolas DEROBERT</span>
                        <span className="mx-2 text-white/40">·</span>
                        <span className="text-white/70">Module CPH-HR-08 · Organisation des ateliers CS horlogers</span>
                    </footer>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
