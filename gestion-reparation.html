<!--
  Gestion SAV — Watch Repair Plus (entreprise fictive) · École d'Horlogerie de Genève, CPH-HO-02
  Version 2.3 — octobre 2026 · fichier autonome : React 18 et html2canvas intégrés, aucune dépendance en ligne
  hormis les polices Google (polices de repli prévues).
  Les trois blocs JSON ci-dessous peuvent être modifiés sans toucher au code :
    - config-entreprise : coordonnées fictives, taux de TVA, taux horaire, durées de garantie ;
                          option « echelleDefauts » : 5 niveaux { niveau, libelle, critere } pour le constat ;
    - catalogue-tarifs  : familles, articles (prix HT en CHF) et gammes opératoires
                          (num, op, dep, h = temps standard, voie = commun|mouvement|habillage) ;
    - dossiers-demo     : dossiers de démonstration chargés au premier lancement (ou via Réglages › Rétablir).
  Document élaboré avec l'assistance d'outils d'intelligence artificielle.
-->
<style>
/* ==========================================================================
   Gestion SAV — Watch Repair Plus (entreprise fictive)
   Charte EHG : tokens repris de ehg.css v1.0 (noir, or, gris ; bleu marine
   réservé aux états interactifs, comme dans les autres applications du module)
   ========================================================================== */
:root{
  color-scheme: light;
  --tete-h:3.75rem; --nav-l:17rem;
  --noir:#141414; --blanc:#FFFFFF; --graphite:#3A3A3A; --acier:#898989; --perle:#EAEAEA; --brume:#F6F6F6;
  --or-base:#AA8802; --or-clair:#D4B24C; --or-fonce:#7D6400;

  --fond:#FFFFFF; --fond-2:#F6F6F6; --carte:#FFFFFF;
  --texte:#141414; --texte-2:#3A3A3A; --texte-3:#6F6F6F;
  --trait:#EAEAEA; --trait-fort:#141414; --trait-moyen:#C9C9C9;
  --or:#AA8802; --or-texte:#7D6400; --or-pale:#F4EDD6;
  --bleu:#1F3D6B; --bleu-texte:#1F3D6B; --bleu-pale:#E7EEF7; --bleu-contour:#7F9BC4; --sur-bleu:#FFFFFF;
  --ok:#2E6B4B; --ok-pale:#E4EFE8; --ko:#9B2C2C; --ko-pale:#F5E4E4; --sur-etat:#FFFFFF;
  --rempli-fond:#EAF1FB; --rempli-trait:#8EA8CE;
  /* intensité des défauts (1 à 5) et schéma de l’habillage */
  --int-0:#CFCFCF; --int-1:#F1E3B0; --int-2:#E0BE55; --int-3:#D9822B; --int-4:#C0502E; --int-5:#9B2C2C;
  --schema-fond:#FFFFFF; --schema-glace:#E2EBF4; --schema-cadran:#F7F5EE; --schema-trait:#3A3A3A;
  --inverse-fond:#141414; --inverse-texte:#FFFFFF;
  --ombre:0 1px 2px rgba(20,20,20,.06), 0 4px 12px rgba(20,20,20,.06);
  --ombre-lg:0 8px 28px rgba(20,20,20,.14);

  --f-titre:"Jost","Century Gothic","Futura","Avenir Next","Calibri Light",sans-serif;
  --f-texte:"Source Sans 3","Calibri","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --f-serif:"Playfair Display","Cambria",Georgia,"Times New Roman",serif;
  --f-mono:"Consolas","SFMono-Regular",Menlo,monospace;

  --r:4px; --r-lg:8px;
  --gouttiere:clamp(1rem,2.6vw,1.75rem);
  --fs:16px; --lh:1.55; --ls:0; --ws:0; --maj:uppercase;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --fond:#0E0E0E; --fond-2:#171717; --carte:#1A1A1A;
    --texte:#F2F2F2; --texte-2:#C9C9C9; --texte-3:#9A9A9A;
    --trait:#2C2C2C; --trait-fort:#C9C9C9; --trait-moyen:#4A4A4A;
    --or:#D4B24C; --or-texte:#D4B24C; --or-pale:#2A2410;
    --bleu:#9DBCE8; --bleu-texte:#9DBCE8; --bleu-pale:#17263C; --bleu-contour:#4E6E9C; --sur-bleu:#141414;
    --ok:#7FBF9B; --ok-pale:#16261D; --ko:#E08B8B; --ko-pale:#2A1717; --sur-etat:#141414; --rempli-fond:#14202F; --rempli-trait:#41608D; --int-0:#5E5E5E; --schema-fond:#262626; --schema-glace:#2B3644; --schema-cadran:#1F1F1F; --schema-trait:#BDBDBD;
    --inverse-fond:#F2F2F2; --inverse-texte:#141414;
    --ombre:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --ombre-lg:0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --fond:#0E0E0E; --fond-2:#171717; --carte:#1A1A1A;
  --texte:#F2F2F2; --texte-2:#C9C9C9; --texte-3:#9A9A9A;
  --trait:#2C2C2C; --trait-fort:#C9C9C9; --trait-moyen:#4A4A4A;
  --or:#D4B24C; --or-texte:#D4B24C; --or-pale:#2A2410;
  --bleu:#9DBCE8; --bleu-texte:#9DBCE8; --bleu-pale:#17263C; --bleu-contour:#4E6E9C; --sur-bleu:#141414;
  --ok:#7FBF9B; --ok-pale:#16261D; --ko:#E08B8B; --ko-pale:#2A1717; --sur-etat:#141414; --rempli-fond:#14202F; --rempli-trait:#41608D; --int-0:#5E5E5E; --schema-fond:#262626; --schema-glace:#2B3644; --schema-cadran:#1F1F1F; --schema-trait:#BDBDBD;
  --inverse-fond:#F2F2F2; --inverse-texte:#141414;
  --ombre:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --ombre-lg:0 12px 32px rgba(0,0,0,.5);
}
/* Mode lisibilité (élèves dyslexiques) : texte plus grand et plus espacé, pas de capitales */
:root[data-lisible="1"]{ --fs:17.5px; --lh:1.75; --ls:.02em; --ws:.1em; --maj:none; }

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--tete-h) + 1rem)}
body{margin:0;background:var(--fond);color:var(--texte);font-family:var(--f-texte);font-size:var(--fs);line-height:var(--lh);letter-spacing:var(--ls);word-spacing:var(--ws);-webkit-font-smoothing:antialiased;overflow-x:clip}
h1,h2,h3,h4{font-family:var(--f-titre);font-weight:400;line-height:1.2;margin:0 0 .6rem;letter-spacing:-.005em;color:var(--texte);text-wrap:balance}
h1{font-size:clamp(1.55rem,3vw,2.1rem)}
h2{font-size:1.35rem}
h3{font-size:1.12rem}
h4{font-size:1rem;font-weight:500}
p{margin:0 0 .8rem}
a{color:var(--bleu-texte);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit;word-spacing:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--bleu);outline-offset:2px}
strong,b{font-weight:600}
[hidden]{display:none!important}
.visuellement-cache{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ico{width:1.2rem;height:1.2rem;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.surtitre{display:block;font-family:var(--f-titre);font-size:.74rem;font-weight:500;letter-spacing:.14em;text-transform:var(--maj);color:var(--texte-2);margin-bottom:.35rem}
.note{font-size:.9rem;color:var(--texte-2)}
.mono{font-family:var(--f-mono);font-size:.92em}
.chiffre{font-family:var(--f-serif);font-variant-numeric:lining-nums tabular-nums}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.saut{position:absolute;left:.5rem;top:-3rem;z-index:100;background:var(--inverse-fond);color:var(--inverse-texte);padding:.5rem .9rem;border-radius:var(--r);text-decoration:none}
.saut:focus{top:.5rem}

/* ---------- écran de chargement / erreur ---------- */
.demarrage{min-height:60vh;display:grid;place-items:center;text-align:center;padding:2rem;color:var(--texte-2);font-family:var(--f-titre)}
.roue{display:inline-block;width:1.4rem;height:1.4rem;border-radius:50%;border:2px solid var(--trait-moyen);border-top-color:var(--or);animation:tourner .8s linear infinite;vertical-align:middle;margin-right:.6rem}
.erreur-fatale{max-width:40rem;margin:3rem auto;padding:1.5rem;border:1px solid var(--ko);border-radius:var(--r-lg);background:var(--ko-pale);color:var(--texte)}
.erreur-fatale pre{white-space:pre-wrap;font-size:.8rem;background:var(--carte);padding:.8rem;border-radius:var(--r)}

/* ---------- en-tête ---------- */
.tete{position:sticky;top:0;z-index:40;background:var(--fond);border-bottom:1px solid var(--trait);padding-top:env(safe-area-inset-top,0px)}
.tete__in{min-height:var(--tete-h);padding:.45rem var(--gouttiere);display:flex;align-items:center;gap:1rem}
.marque{display:flex;flex-direction:column;min-width:0;text-decoration:none;color:inherit}
.logo{font-family:var(--f-titre);font-size:1rem;color:var(--texte);white-space:nowrap}
.logo b{font-weight:400;color:var(--or)}
.module{font-family:var(--f-titre);font-size:.66rem;letter-spacing:.12em;text-transform:var(--maj);color:var(--texte-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tete__dossier{flex:1;display:flex;align-items:center;justify-content:center;gap:.4rem;min-width:0}
.tete__id{display:flex;flex-direction:column;align-items:center;min-width:0;padding:0 .3rem}
.tete__id b{font-family:var(--f-mono);font-weight:600;font-size:.95rem;white-space:nowrap}
.tete__id span{font-size:.78rem;color:var(--texte-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:18rem}
.outils{display:flex;gap:.4rem;align-items:center;margin-left:auto}
.btn-mini{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;background:none;border:1px solid var(--trait);color:var(--texte-2);border-radius:var(--r);padding:.35rem .65rem;font-family:var(--f-titre);font-size:.74rem;letter-spacing:.06em;text-transform:var(--maj);line-height:1.2;min-height:2.5rem;min-width:2.5rem;text-decoration:none;white-space:nowrap}
.btn-mini:hover{border-color:var(--texte-2);color:var(--texte)}
.btn-mini[aria-pressed="true"]{background:var(--inverse-fond);color:var(--inverse-texte);border-color:var(--inverse-fond)}
.btn-mini:disabled{opacity:.4;cursor:not-allowed}
.btn-mini svg.ico{width:1.05rem;height:1.05rem}
.btn-mini--aa{text-transform:none;font-family:var(--f-texte);font-size:.95rem;letter-spacing:0}
.btn-rond{width:2.5rem;height:2.5rem;border-radius:999px;border:1px solid var(--trait);background:var(--carte);color:var(--texte-2);display:inline-grid;place-items:center;padding:0}
.btn-rond:hover:not(:disabled){border-color:var(--bleu-contour);color:var(--bleu-texte)}
.btn-rond:disabled{opacity:.35;cursor:not-allowed}
.enreg{display:inline-flex;align-items:center;gap:.35rem;font-size:.78rem;color:var(--texte-3);white-space:nowrap}
.enreg i{width:.5rem;height:.5rem;border-radius:50%;background:var(--ok);display:inline-block}
.enreg.en-cours i{background:var(--or)}
.enreg.erreur{color:var(--ko)} .enreg.erreur i{background:var(--ko)}

/* ---------- mise en page ---------- */
.corps{display:grid;grid-template-columns:var(--nav-l) minmax(0,1fr);align-items:start;min-height:calc(100vh - var(--tete-h))}
.corps--plein{grid-template-columns:minmax(0,1fr)}
#contenu:focus{outline:none}
.nav{position:sticky;top:var(--tete-h);max-height:calc(100vh - var(--tete-h));overflow:auto;border-right:1px solid var(--trait);padding:1rem .8rem 1.5rem;background:var(--fond)}
.contenu{min-width:0;padding:1.4rem var(--gouttiere) 0;display:flex;flex-direction:column;min-height:calc(100vh - var(--tete-h))}
.page{max-width:72rem;width:100%;margin:0 auto;flex:1}
.page--large{max-width:80rem}

/* ---------- navigation des étapes ---------- */
.nav__lien{display:flex;align-items:center;gap:.6rem;width:100%;padding:.55rem .6rem;border:0;border-radius:var(--r-lg);background:none;color:var(--texte-2);text-align:left;font-family:var(--f-titre);font-size:.95rem;line-height:1.25;text-decoration:none;min-height:2.6rem}
.nav__lien:hover{background:var(--fond-2);color:var(--texte)}
.nav__lien[aria-current="page"]{background:var(--bleu-pale);color:var(--bleu-texte)}
.nav__titre{font-family:var(--f-titre);font-size:.7rem;letter-spacing:.12em;text-transform:var(--maj);color:var(--texte-3);margin:1.1rem .6rem .4rem}
.etapes{list-style:none;margin:0;padding:0;counter-reset:none}
.etapes li{position:relative}
.etapes li+li::before{content:"";position:absolute;left:1.45rem;top:-.35rem;height:.7rem;border-left:1px solid var(--trait-moyen)}
.pastille{flex:0 0 auto;width:1.75rem;height:1.75rem;border-radius:50%;display:grid;place-items:center;font-family:var(--f-serif);font-size:.95rem;border:1px solid var(--trait-moyen);background:var(--carte);color:var(--texte-2)}
.pastille svg.ico{width:.95rem;height:.95rem;stroke-width:2.2}
.nav__lien[data-etat="fait"] .pastille{background:var(--ok-pale);border-color:transparent;color:var(--ok)}
.nav__lien[data-etat="courant"] .pastille{background:var(--or-pale);border-color:var(--or);color:var(--or-texte)}
.nav__lien[data-etat="sans_objet"]{color:var(--texte-3)}
.nav__lien[data-etat="sans_objet"] .pastille{border-style:dashed;color:var(--texte-3)}
.nav__lien[data-etat="a_venir"] .pastille{color:var(--texte-3)}
.nav__lien small{display:block;font-family:var(--f-texte);font-size:.76rem;color:var(--texte-3);letter-spacing:0}
.nav__lien[aria-current="page"] small{color:var(--bleu-texte)}
.fiche-mini{margin:1.2rem .3rem 0;padding:.8rem .9rem;border:1px solid var(--trait);border-radius:var(--r-lg);background:var(--fond-2);font-size:.85rem;color:var(--texte-2)}
.fiche-mini b{display:block;color:var(--texte);font-weight:600}
.fiche-mini p{margin:0 0 .35rem}
.fermer-nav{display:none}

/* ---------- en-tête d'étape ---------- */
.etape-tete{display:flex;align-items:flex-start;gap:1rem;margin-bottom:1.2rem}
.etape-tete__n{font-family:var(--f-serif);font-size:2.4rem;line-height:.95;color:var(--or);min-width:2.2rem}
.etape-tete__t{flex:1;min-width:0}
.etape-tete h1{margin-bottom:.25rem}
.etape-tete p{margin:0;color:var(--texte-2);max-width:48rem}
.etape-tete__outils{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:flex-end}

/* ---------- boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-family:var(--f-titre);font-size:.8rem;font-weight:500;letter-spacing:.06em;text-transform:var(--maj);padding:.65rem 1.15rem;border-radius:var(--r);border:1px solid var(--texte);background:var(--texte);color:var(--fond);line-height:1.15;min-height:2.75rem;text-decoration:none;transition:background .15s,color .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--texte-2);border-color:var(--texte-2)}
.btn:active{transform:scale(.97)}
.btn svg.ico{width:1.05rem;height:1.05rem}
.btn--sec{background:none;color:var(--texte)}
.btn--sec:hover{background:var(--bleu-pale);color:var(--bleu-texte);border-color:var(--bleu)}
.btn--or{background:var(--or-base);border-color:var(--or-base);color:var(--noir)}
.btn--or:hover{background:var(--or-clair);border-color:var(--or-clair);color:var(--noir)}
.btn--discret{background:none;border-color:transparent;color:var(--texte-2);padding-inline:.6rem}
.btn--discret:hover{background:var(--fond-2);border-color:transparent;color:var(--texte)}
.btn--danger{background:none;color:var(--ko);border-color:var(--ko)}
.btn--danger:hover{background:var(--ko-pale);color:var(--ko);border-color:var(--ko)}
.btn--petit{min-height:2.3rem;padding:.4rem .75rem;font-size:.74rem}
.btn[disabled],.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-icone{display:inline-grid;place-items:center;width:2.5rem;height:2.5rem;border-radius:var(--r);border:1px solid transparent;background:none;color:var(--texte-2);padding:0;flex:0 0 auto}
.btn-icone:hover{background:var(--fond-2);color:var(--texte)}
.btn-icone--danger:hover{background:var(--ko-pale);color:var(--ko)}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}

/* ---------- barre d'actions (bas de page) ---------- */
.barre{position:sticky;bottom:0;z-index:20;margin:1.5rem calc(-1 * var(--gouttiere)) 0;padding:.75rem var(--gouttiere) calc(.75rem + env(safe-area-inset-bottom,0px));background:var(--fond);border-top:1px solid var(--trait);box-shadow:0 -6px 18px rgba(20,20,20,.05);display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.barre__info{flex:1;min-width:12rem;font-size:.88rem;color:var(--texte-2)}
.barre__info b{color:var(--texte)}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:.3rem;font-family:var(--f-titre);font-size:.68rem;font-weight:500;letter-spacing:.07em;text-transform:var(--maj);padding:.22em .65em;border-radius:999px;background:var(--fond-2);border:1px solid var(--trait);color:var(--texte-2);line-height:1.4;white-space:nowrap}
.badge--alerte{background:var(--or-pale);border-color:transparent;color:var(--or-texte)}
.badge--ok{background:var(--ok-pale);border-color:transparent;color:var(--ok)}
.badge--erreur{background:var(--ko-pale);border-color:transparent;color:var(--ko)}
.badge--bleu{background:var(--bleu-pale);border-color:transparent;color:var(--bleu-texte)}
.badge--noir{background:var(--inverse-fond);border-color:transparent;color:var(--inverse-texte)}
.badge--contour{background:transparent}

/* ---------- cartes et encadrés ---------- */
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:var(--r-lg);padding:1.2rem 1.3rem;margin-bottom:1.1rem;box-shadow:var(--ombre)}
.carte__tete{display:flex;align-items:flex-start;justify-content:space-between;gap:.8rem 1rem;flex-wrap:wrap;margin-bottom:.9rem}
.carte__tete h2{margin:0;font-size:1.2rem}
.carte__tete p{margin:.2rem 0 0;color:var(--texte-2);font-size:.9rem}
.carte--sobre{box-shadow:none;background:var(--fond-2)}
.encadre{display:flex;gap:.8rem;align-items:flex-start;padding:.8rem 1rem;border-radius:var(--r-lg);background:var(--fond-2);border:1px solid var(--trait);color:var(--texte);margin-bottom:1rem;font-size:.95rem}
.encadre>svg.ico{margin-top:.15rem;color:var(--texte-2)}
.encadre p:last-child,.encadre ul:last-child{margin-bottom:0}
.encadre--or{background:var(--or-pale);border-color:transparent} .encadre--or>svg.ico{color:var(--or-texte)}
.encadre--ok{background:var(--ok-pale);border-color:transparent} .encadre--ok>svg.ico{color:var(--ok)}
.encadre--erreur{background:var(--ko-pale);border-color:transparent} .encadre--erreur>svg.ico{color:var(--ko)}
.encadre--bleu{background:var(--bleu-pale);border-color:transparent} .encadre--bleu>svg.ico{color:var(--bleu-texte)}
.encadre__corps{flex:1;min-width:0}
.encadre__titre{display:block;font-family:var(--f-titre);font-weight:500;margin-bottom:.15rem}

/* ---------- formulaires ---------- */
.grille{display:grid;gap:.9rem 1.1rem;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr))}
.grille--3{--cols:3} .grille--4{--cols:4} .grille--1{--cols:1}
.col-2{grid-column:span 2} .col-tout{grid-column:1/-1}
.champ{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.champ__label{font-family:var(--f-titre);font-size:.88rem;font-weight:500;color:var(--texte);display:flex;align-items:center;gap:.4rem}
.champ__label .requis{color:var(--ko);font-weight:600}
.champ__aide{font-size:.8rem;color:var(--texte-3)}
.champ__erreur{font-size:.82rem;color:var(--ko)}
.saisie{width:100%;min-height:2.6rem;border:1px solid var(--trait-moyen);border-radius:var(--r);background:var(--fond);color:var(--texte);padding:.5rem .7rem;transition:border-color .15s}
.saisie:hover{border-color:var(--texte-3)}
.saisie:focus{border-color:var(--bleu);outline:2px solid var(--bleu-contour);outline-offset:0}
.saisie[aria-invalid="true"]{border-color:var(--ko)}
/* Champ renseigné : teinte de saisie bleu pâle (le jaune or est réservé aux alertes et aux étapes en cours) */
.saisie[data-rempli]{background:var(--rempli-fond);border-color:var(--rempli-trait)}
.saisie[data-rempli]:hover{border-color:var(--bleu)}
.case:has(input:checked)>span{color:var(--texte)}
.saisie:disabled,.saisie[readonly]{background:var(--fond-2);color:var(--texte-2)}
textarea.saisie{min-height:5.5rem;resize:vertical;line-height:1.5}
select.saisie{padding-right:2rem}
.saisie--num{text-align:right;font-variant-numeric:tabular-nums}
.saisie--compacte{min-height:2.3rem;padding:.35rem .5rem}
.case{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;padding:.35rem 0;line-height:1.35}
.case input{width:1.2rem;height:1.2rem;margin:.1rem 0 0;flex:0 0 auto;accent-color:var(--bleu)}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.1rem 1.2rem}

/* puces (choix multiples) */
.puces{display:flex;flex-wrap:wrap;gap:.4rem}
.puce{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--trait-moyen);border-radius:999px;background:var(--carte);color:var(--texte-2);padding:.35rem .8rem;min-height:2.3rem;font-size:.9rem;line-height:1.2;transition:background .15s,border-color .15s,color .15s}
.puce:hover{border-color:var(--bleu-contour);color:var(--texte)}
.puce[aria-pressed="true"]{background:var(--bleu);border-color:var(--bleu);color:var(--sur-bleu)}
.puce[aria-pressed="true"].puce--ras{background:var(--ok);border-color:var(--ok);color:var(--sur-etat)}
.puce svg.ico{width:.95rem;height:.95rem}

/* sélecteur segmenté (un seul choix) */
.segment{display:inline-flex;border:1px solid var(--trait-moyen);border-radius:var(--r-lg);overflow:hidden;background:var(--carte);flex-wrap:nowrap}
.segment button{border:0;border-right:1px solid var(--trait);background:none;color:var(--texte-2);padding:.35rem .7rem;min-height:2.3rem;font-size:.85rem;line-height:1.2;white-space:nowrap}
.segment button:last-child{border-right:0}
.segment button:hover{background:var(--fond-2);color:var(--texte)}
.segment button[aria-pressed="true"]{background:var(--bleu);color:var(--sur-bleu)}
.segment button[aria-pressed="true"][data-ton="ok"]{background:var(--ok);color:var(--sur-etat)}
.segment button[aria-pressed="true"][data-ton="erreur"]{background:var(--ko);color:var(--sur-etat)}
.segment button[aria-pressed="true"][data-ton="neutre"]{background:var(--texte-2);color:var(--fond)}
.segment--mini button{min-height:2rem;padding:.2rem .55rem;font-size:.8rem}

/* ---------- tableaux ---------- */
.tableau-conteneur{overflow-x:auto;border:1px solid var(--trait);border-radius:var(--r-lg);background:var(--carte)}
.tableau{width:100%;border-collapse:collapse;font-size:.92rem}
.tableau caption{text-align:left;font-family:var(--f-titre);padding:.7rem .9rem .3rem;color:var(--texte-2)}
.tableau th,.tableau td{padding:.55rem .75rem;text-align:left;vertical-align:middle;border-bottom:1px solid var(--trait)}
.tableau thead th{font-family:var(--f-titre);font-weight:500;font-size:.72rem;letter-spacing:.08em;text-transform:var(--maj);color:var(--texte-2);border-bottom:2px solid var(--trait-fort);background:var(--carte);white-space:nowrap}
.tableau tbody tr:last-child td,.tableau tbody tr:last-child th{border-bottom:0}
.tableau tfoot td,.tableau tfoot th{font-weight:600;border-top:2px solid var(--trait-fort);border-bottom:0}
.tableau--survol tbody tr:hover{background:var(--fond-2)}
.tableau .ligne-cliquable{cursor:pointer}
.tableau .ligne-cliquable:hover .ligne-lien{color:var(--bleu-texte);text-decoration:underline}
.tableau .groupe td{background:var(--fond-2);font-family:var(--f-titre);font-size:.78rem;letter-spacing:.08em;text-transform:var(--maj);color:var(--texte-2)}
.tableau td.num,.tableau th.num{text-align:right}
.tableau .ligne-lien{display:block;text-align:left;border:0;background:none;padding:0;color:var(--texte);font-weight:600;font-family:var(--f-mono);font-size:.9rem}
.tableau .ligne-lien:hover{color:var(--bleu-texte);text-decoration:underline}
.tableau .secondaire{display:block;font-size:.8rem;color:var(--texte-3)}
.tableau .refuse td{color:var(--texte-3)}
.tableau .refuse .designation{text-decoration:line-through}

/* ---------- tableau de bord ---------- */
.tdb-tete{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem 2rem;flex-wrap:wrap;margin-bottom:1.3rem}
.tdb-tete h1{margin-bottom:.2rem}
.tdb-tete p{margin:0;color:var(--texte-2)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.9rem;margin-bottom:1.1rem}
.kpi{border:1px solid var(--trait);border-radius:var(--r-lg);background:var(--carte);padding:.9rem 1rem;text-align:left;display:flex;flex-direction:column;gap:.1rem;min-height:6rem;transition:border-color .15s,transform .15s}
button.kpi:hover{border-color:var(--bleu-contour)}
button.kpi[aria-pressed="true"]{border-color:var(--bleu);box-shadow:inset 0 0 0 1px var(--bleu)}
.kpi b{font-family:var(--f-serif);font-weight:400;font-size:2.1rem;line-height:1.05;color:var(--or)}
.kpi--alerte b{color:var(--ko)}
.kpi span{font-family:var(--f-titre);font-size:.72rem;letter-spacing:.1em;text-transform:var(--maj);color:var(--texte-2)}
.kpi small{font-size:.8rem;color:var(--texte-3)}
.tdb-cartes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.1rem;align-items:stretch;margin-bottom:.4rem}
.tdb-cartes .carte{margin-bottom:.8rem}
.charge{display:grid;gap:.45rem}
.charge__l{display:grid;grid-template-columns:7.5rem minmax(0,1fr) 1.8rem;align-items:center;gap:.6rem;font-size:.88rem}
.charge__l span:first-child{color:var(--texte-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.charge__b{height:.55rem;background:var(--trait);border-radius:999px;overflow:hidden}
.charge__b i{display:block;height:100%;background:var(--texte-2);border-radius:999px}
.charge__l b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.filtres{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:.8rem}
.filtres .saisie{max-width:22rem}
.recherche{position:relative;flex:1 1 16rem;max-width:24rem}
.recherche svg.ico{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:var(--texte-3);pointer-events:none}
.recherche .saisie{padding-left:2.3rem;max-width:none}
.alertes{display:grid;gap:.5rem}
.alerte{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.55rem .7rem;border-radius:var(--r-lg);background:var(--ko-pale);color:var(--texte);font-size:.88rem;border:0;text-align:left;width:100%}
.alerte:hover{box-shadow:inset 0 0 0 1px var(--ko)}
.alerte b{font-family:var(--f-mono);font-weight:600}
.alerte span{color:var(--ko);font-weight:600;white-space:nowrap}
.vide{border:1px dashed var(--trait-moyen);border-radius:var(--r-lg);padding:2rem 1.2rem;text-align:center;color:var(--texte-2)}
.progres{height:5px;background:var(--trait);border-radius:999px;overflow:hidden;min-width:3rem}
.progres>span{display:block;height:100%;background:var(--or);border-radius:999px;transition:width .3s}
.progres--ok>span{background:var(--ok)}

/* ---------- lignes de travaux ---------- */
.catalogue{border:1px solid var(--trait);border-radius:var(--r-lg);background:var(--fond-2);padding:.8rem}
.catalogue__outils{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem}
.catalogue details{border-top:1px solid var(--trait)}
.catalogue details:first-of-type{border-top:0}
.catalogue summary{cursor:pointer;padding:.55rem .3rem;font-family:var(--f-titre);font-size:.92rem;display:flex;justify-content:space-between;gap:.5rem;list-style:none}
.catalogue summary::-webkit-details-marker{display:none}
.catalogue summary::before{content:"▸";color:var(--texte-3);margin-right:.4rem;transition:transform .15s;display:inline-block}
.catalogue details[open] summary::before{transform:rotate(90deg)}
.catalogue summary span{flex:1}
.catalogue summary small{color:var(--texte-3);font-family:var(--f-texte)}
.catalogue ul{list-style:none;margin:0 0 .4rem;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:.35rem}
.art{display:flex;align-items:center;justify-content:space-between;gap:.6rem;width:100%;padding:.45rem .6rem;border:1px solid var(--trait);border-radius:var(--r);background:var(--carte);text-align:left;font-size:.88rem;min-height:2.6rem}
.art:hover:not(:disabled){border-color:var(--bleu-contour);background:var(--bleu-pale)}
.art:disabled{opacity:.5;cursor:default}
.art b{font-weight:400}
.art span{font-variant-numeric:tabular-nums;color:var(--texte-2);white-space:nowrap}
.lignes td{vertical-align:top}
.lignes .saisie{min-height:2.3rem}
.lignes .libelle{min-width:12rem}
.total-bloc{display:grid;gap:.25rem;justify-items:end;margin-top:.8rem;font-size:.95rem}
.total-bloc div{display:flex;gap:1.2rem;justify-content:space-between;min-width:18rem}
.total-bloc .fort{font-size:1.1rem;font-weight:600;border-top:2px solid var(--trait-fort);padding-top:.35rem}

/* ---------- listes de lignes (travaux, opérations, compléments) ---------- */
.liste-lignes{list-style:none;margin:0;padding:0;border:1px solid var(--trait);border-radius:var(--r-lg);background:var(--carte);overflow:hidden}
.ligne{display:grid;gap:.5rem;padding:.7rem .85rem;border-bottom:1px solid var(--trait)}
.ligne:last-child{border-bottom:0}
.ligne[data-statut="termine"]{background:var(--ok-pale)}
.ligne[data-statut="en_cours"]{background:var(--or-pale)}
.ligne__haut{display:flex;gap:.6rem;align-items:center}
.ligne__haut>.saisie{flex:1;min-width:0;font-weight:500}
.ligne__haut>.badge{flex:0 0 auto}
.ligne__haut>.ligne__type{flex:0 0 auto;width:auto;min-width:7.5rem;font-weight:400}
.ligne__bas{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center}
.ligne__bas>select.saisie{width:auto;min-width:11rem}
.ligne__bas .case{padding:0;font-size:.9rem}
.mini-champ{display:inline-flex;align-items:center;gap:.45rem;font-size:.85rem;color:var(--texte-2);white-space:nowrap}
.mini-champ .saisie{width:6.5rem}
.num-op .saisie{width:4.6rem}
.ligne__montant{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.liste-pied{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.4rem 1.4rem;padding:.6rem .2rem 0;font-size:.9rem;color:var(--texte-2)}
.liste-pied b{color:var(--texte);font-variant-numeric:tabular-nums}
.fiche-mini .btn{white-space:normal;text-transform:none;letter-spacing:0;font-family:var(--f-texte);font-size:.88rem;font-weight:400;justify-content:flex-start;text-align:left;min-height:2.3rem;padding:.3rem .4rem;width:100%}

/* ---------- demande du client (accueil) ---------- */
.sous-titre-carte{font-size:1rem;margin:1.3rem 0 .3rem;padding-top:1rem;border-top:1px solid var(--trait)}
.liste-simple{list-style:none;margin:.5rem 0 .6rem;padding:0;display:grid;gap:.4rem}
.liste-simple li{display:flex;align-items:center;gap:.5rem}
.liste-simple li .saisie{flex:1;min-width:0}
.liste-simple__n{flex:0 0 auto;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--fond-2);border:1px solid var(--trait-moyen);display:grid;place-items:center;font-family:var(--f-titre);font-size:.78rem;color:var(--texte-2)}
.probleme-choix{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;margin-top:.5rem;font-weight:500}
.qqoqcp-acces{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .9rem;margin-top:.8rem}
.qqoqcp-acces .note{margin:0}

/* ---------- constat de l’habillage ---------- */
.constat{display:grid;grid-template-columns:minmax(15rem,24rem) minmax(0,1fr);gap:1.2rem 1.6rem;align-items:start}
.constat__schema{position:sticky;top:calc(var(--tete-h) + 1rem)}
.constat__obs{margin-top:1.1rem}
.schema-hab{margin:0}
.schema-hab svg{width:100%;height:auto;display:block;overflow:visible}
.schema-hab__zone{stroke:var(--schema-trait);stroke-width:1.1;cursor:pointer;transition:fill .15s,stroke .15s}
.schema-hab__zone:hover,.schema-hab__zone:focus-visible{stroke:var(--bleu);stroke-width:2.6;outline:none}
.schema-hab__zone[role="img"]{cursor:default}
.schema-hab__zone[data-zone="poussoirs"]{stroke-dasharray:2 1.5}
.schema-hab__deco{stroke:var(--schema-trait);stroke-width:1;fill:none;pointer-events:none;opacity:.55}
.schema-hab__legendes text{font-family:var(--f-titre);font-size:10.5px;fill:var(--texte-3);letter-spacing:.06em}
.schema-hab figcaption{display:flex;flex-wrap:wrap;gap:.3rem .7rem;align-items:center;font-size:.78rem;color:var(--texte-2);margin-top:.5rem}
.schema-hab figcaption .note{flex-basis:100%;margin:0}
.schema-hab__leg{display:inline-flex;align-items:center;gap:.3rem}
.schema-hab__leg i{width:.85rem;height:.85rem;border:1px solid var(--schema-trait);border-radius:2px;display:inline-block}
.defaut__n{flex:0 0 auto;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--inverse-fond);color:var(--inverse-texte);display:grid;place-items:center;font-family:var(--f-titre);font-size:.78rem}
.defaut__precision{flex:1 1 14rem;min-width:0;width:auto}
.echelle{display:flex;align-items:center;gap:.4rem .7rem;flex-wrap:wrap}
.echelle__barres{display:flex;align-items:flex-end;gap:.22rem}
.echelle__n{width:2.15rem;border:1px solid var(--trait-moyen);border-radius:3px;background:var(--fond-2);color:var(--texte-2);font-family:var(--f-titre);font-size:.8rem;font-weight:500;display:grid;place-items:end center;padding:0 0 .2rem;line-height:1;transition:background .12s}
.echelle__n[data-niveau="1"]{height:1.7rem}.echelle__n[data-niveau="2"]{height:2rem}.echelle__n[data-niveau="3"]{height:2.3rem}.echelle__n[data-niveau="4"]{height:2.6rem}.echelle__n[data-niveau="5"]{height:2.9rem}
.echelle__n:hover:not(:disabled){border-color:var(--bleu)}
.echelle__n[data-actif]{border-color:transparent}
.echelle__n[aria-pressed="true"]{outline:2px solid var(--texte);outline-offset:1px}
.echelle__lib{font-size:.86rem;font-weight:600;min-width:8.6rem}
.echelle__lib--vide{font-weight:400;font-style:italic;color:var(--texte-3)}
.echelle__n[data-actif][data-niveau="1"],.echelle-def__pastille[data-niveau="1"],.jauge__cases i[data-actif][data-niveau="1"]{background:var(--int-1);color:#141414}
.echelle__n[data-actif][data-niveau="2"],.echelle-def__pastille[data-niveau="2"],.jauge__cases i[data-actif][data-niveau="2"]{background:var(--int-2);color:#141414}
.echelle__n[data-actif][data-niveau="3"],.echelle-def__pastille[data-niveau="3"],.jauge__cases i[data-actif][data-niveau="3"]{background:var(--int-3);color:#141414}
.echelle__n[data-actif][data-niveau="4"],.echelle-def__pastille[data-niveau="4"],.jauge__cases i[data-actif][data-niveau="4"]{background:var(--int-4);color:#FFFFFF}
.echelle__n[data-actif][data-niveau="5"],.echelle-def__pastille[data-niveau="5"],.jauge__cases i[data-actif][data-niveau="5"]{background:var(--int-5);color:#FFFFFF}
.echelle-def{display:grid;grid-template-columns:auto 1fr;gap:.35rem .8rem;margin:.6rem 0;font-size:.88rem}
.echelle-def dt{display:flex;align-items:center;gap:.45rem;font-weight:600;margin:0}
.echelle-def dd{margin:0;color:var(--texte-2)}
.echelle-def__pastille{width:1.45rem;height:1.45rem;border-radius:3px;display:grid;place-items:center;font-family:var(--f-titre);font-size:.75rem}
.jauge{display:inline-flex;align-items:center;gap:.4rem;white-space:nowrap}
.jauge__cases{display:inline-flex;gap:2px}
.jauge__cases i{width:.55rem;height:.75rem;border:1px solid #6F6F6F;border-radius:1px;display:block}
.doc-h3{font-size:.92rem;font-weight:600;margin:.8rem 0 .3rem}
.tableau--defauts td{vertical-align:top}

/* ---------- synoptique de la réparation (logigramme) ---------- */
.synoptique{margin:0;container-type:inline-size}
.flux{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;width:100%}
.flux__item{display:flex;flex-direction:column;align-items:center;width:100%}
.flux__fl{display:block;width:2px;height:1.15rem;margin:0 auto 7px;background:var(--texte-3);position:relative}
.flux__fl::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-top:7px solid var(--texte-3)}
.flux__borne{display:inline-flex;justify-content:center;width:auto;min-width:13rem;max-width:100%;background:var(--inverse-fond);color:var(--inverse-texte);border-radius:999px;padding:.4rem 1rem;font-family:var(--f-titre);font-size:.76rem;letter-spacing:.05em;text-transform:var(--maj);text-align:center;line-height:1.3}
.flux__op{width:min(100%,27rem);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.55rem;align-items:center;text-align:left;border:1px solid var(--trait-moyen);border-radius:var(--r);background:var(--carte);color:var(--texte);padding:.45rem .65rem;box-shadow:var(--ombre);font:inherit}
button.flux__op{cursor:pointer}
button.flux__op:hover{border-color:var(--bleu)}
.flux__op[data-statut="termine"]{background:var(--ok-pale);border-color:var(--ok)}
.flux__op[data-statut="en_cours"]{background:var(--or-pale);border-color:var(--or)}
.flux__op[data-prochaine]{outline:2px dashed var(--bleu);outline-offset:2px}
.flux__op--etape{border-style:double;border-width:3px}
.flux__num{font-family:var(--f-mono);font-size:.78rem;color:var(--texte-2);min-width:2rem}
.flux__txt b{display:block;font-weight:500;font-size:.88rem;line-height:1.3}
.flux__txt small{display:block;color:var(--texte-2);font-size:.75rem;line-height:1.3}
.flux__etat{display:inline-flex;align-items:center;gap:.25rem;font-family:var(--f-titre);font-size:.7rem;letter-spacing:.04em;text-transform:var(--maj);color:var(--texte-2);white-space:nowrap}
.flux__etat svg.ico{width:.9rem;height:.9rem}
.flux__op[data-statut="termine"] .flux__etat{color:var(--ok)}
.flux__op[data-statut="en_cours"] .flux__etat{color:var(--or-texte)}
.flux__fourche{display:flex;align-items:center;gap:.6rem;width:100%;margin:.1rem 0}
.flux__barre{flex:1;height:5px;border-radius:2px;background:var(--texte)}
.flux__fourche small{font-family:var(--f-titre);font-size:.7rem;letter-spacing:.04em;color:var(--texte-2);white-space:nowrap}
.flux__voies{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem;width:100%;margin:.5rem 0}
.flux__voie{container-type:inline-size;border:1px dashed var(--trait-moyen);border-radius:var(--r-lg);background:var(--fond-2);padding:.55rem .6rem .7rem;min-width:0}
.flux__voie h3{margin:0 0 .1rem;font-size:.9rem;font-weight:600;display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.flux__voie h3 small{font-weight:400;font-size:.75rem;color:var(--texte-2)}
.flux__voie .note{margin:.4rem 0 0}
.synoptique figcaption{display:flex;flex-wrap:wrap;gap:.35rem .9rem;align-items:center;margin-top:1rem;font-size:.78rem;color:var(--texte-2)}
.synoptique figcaption .note{flex-basis:100%;margin:0}
.flux-leg{display:inline-flex;align-items:center;gap:.35rem}
.flux-leg i{display:inline-block}
.flux-leg__borne{width:1.4rem;height:.8rem;border-radius:999px;background:var(--inverse-fond)}
.flux-leg__op{width:1.3rem;height:.85rem;border:1px solid var(--trait-moyen);border-radius:2px;background:var(--carte)}
.flux-leg__op[data-statut="en_cours"]{background:var(--or-pale);border-color:var(--or)}
.flux-leg__op[data-statut="termine"]{background:var(--ok-pale);border-color:var(--ok)}
.ligne--repere{animation:repere 1.6s ease-out}
